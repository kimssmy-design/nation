<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매점 결제 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.shop-wrap { max-width: 420px; margin: 0 auto; padding: 16px; }

/* 매점 헤더 */
.shop-hero {
  text-align: center;
  padding: 24px 0 20px;
}
.shop-hero .emoji { font-size: 52px; margin-bottom: 10px; }
.shop-hero h1 {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--gold); margin-bottom: 4px;
}
.shop-hero p { font-size: 13px; color: var(--text-dim); }

/* 단계 표시 */
.step-bar {
  display: flex; align-items: center;
  justify-content: center; gap: 8px;
  margin-bottom: 20px;
}
.step {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: var(--navy-light); color: var(--text-dim);
  transition: all 0.3s;
}
.step.active { background: var(--gold); color: var(--navy); }
.step.done { background: var(--accent3); color: var(--navy); }
.step-line { flex: 1; height: 2px; background: var(--navy-light); max-width: 40px; }

/* 이름 그리드 */
.name-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 14px;
  max-height: 220px; overflow-y: auto;
}
.name-chip {
  background: var(--navy-mid);
  border: 1px solid var(--navy-light);
  border-radius: 8px; padding: 8px 4px;
  text-align: center; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
}
.name-chip:hover { border-color: var(--gold); color: var(--gold); }
.name-chip.selected {
  background: rgba(255,215,0,0.15);
  border-color: var(--gold); color: var(--gold); font-weight: 700;
}

/* 잔고 카드 */
.balance-card {
  background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
  border: 1px solid var(--gold);
  border-radius: 16px; padding: 20px;
  text-align: center; margin-bottom: 16px;
}
.balance-name { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
.balance-amount {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 36px; font-weight: 700; color: var(--gold);
}
.balance-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* 금액 버튼 */
.amount-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px; margin-bottom: 16px;
}
.amount-btn {
  background: var(--card);
  border: 2px solid var(--navy-light);
  border-radius: 14px; padding: 20px 10px;
  text-align: center; cursor: pointer;
  transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
}
.amount-btn:hover { border-color: var(--gold); }
.amount-btn.selected {
  background: rgba(255,215,0,0.1);
  border-color: var(--gold);
}
.amount-btn .price {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 24px; font-weight: 700; color: var(--gold);
}
.amount-btn .price-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.amount-btn.disabled {
  opacity: 0.35; cursor: not-allowed; pointer-events: none;
}

/* 결제 확인 팝업 */
.confirm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.confirm-box {
  background: var(--navy-mid);
  border: 2px solid var(--gold);
  border-radius: 20px; padding: 30px 24px;
  width: 100%; max-width: 340px;
  text-align: center;
}
.confirm-emoji { font-size: 48px; margin-bottom: 12px; }
.confirm-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
.confirm-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
.confirm-amount {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 32px; font-weight: 700; color: var(--gold);
  margin-bottom: 20px;
}
.confirm-after {
  font-size: 13px; color: var(--text-dim); margin-bottom: 24px;
}

/* 완료 팝업 */
.done-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 300; padding: 20px;
}
.done-box {
  background: var(--navy-mid);
  border: 2px solid var(--accent3);
  border-radius: 20px; padding: 36px 24px;
  width: 100%; max-width: 340px;
  text-align: center;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.done-emoji { font-size: 64px; margin-bottom: 16px; }
.done-title {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 24px; font-weight: 700; color: var(--accent3);
  margin-bottom: 8px;
}
.done-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.done-amount {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 28px; color: var(--gold); font-weight: 700;
  margin-bottom: 4px;
}
.done-balance { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
.done-countdown { font-size: 12px; color: var(--text-dim); }

/* 잔고부족 팝업 */
.fail-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 300; padding: 20px;
}
.fail-box {
  background: var(--navy-mid);
  border: 2px solid var(--accent2);
  border-radius: 20px; padding: 36px 24px;
  width: 100%; max-width: 340px;
  text-align: center;
  animation: popIn 0.3s ease;
}
.fail-emoji { font-size: 64px; margin-bottom: 16px; }
.fail-title {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 22px; font-weight: 700; color: var(--accent2);
  margin-bottom: 8px;
}
.fail-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.6; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">🛒 매점 결제<span id="nationName">선영국가</span></div>
  <a href="me.html" class="btn btn-outline btn-sm">← 돌아가기</a>
</div>

<div class="shop-wrap">
  <div class="shop-hero">
    <div class="emoji">🏪</div>
    <h1>매점 결제</h1>
    <p>이름을 선택하고 비밀번호를 입력하세요</p>
  </div>

  <!-- 단계 표시 -->
  <div class="step-bar">
    <div class="step active" id="step1">1</div>
    <div class="step-line"></div>
    <div class="step" id="step2">2</div>
    <div class="step-line"></div>
    <div class="step" id="step3">3</div>
  </div>

  <!-- STEP 1: 이름 선택 + 비번 입력 -->
  <div id="panel-login">
    <div class="card">
      <div class="input-group">
        <label>내 이름 선택</label>
        <div class="name-grid" id="nameGrid">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="input-group">
        <label>선택된 이름</label>
        <input type="text" id="selectedNameInput" readonly placeholder="위에서 이름을 선택하세요">
      </div>
      <div class="input-group">
        <label>비밀번호 (숫자 4자리)</label>
        <input type="password" id="shopPw" maxlength="4" inputmode="numeric" placeholder="비밀번호 입력">
      </div>
      <button class="btn btn-gold btn-full" onclick="doShopLogin()">다음 →</button>
    </div>
  </div>

  <!-- STEP 2: 금액 선택 -->
  <div id="panel-amount" style="display:none;">
    <div class="balance-card">
      <div class="balance-name" id="balanceName"></div>
      <div class="balance-amount" id="balanceAmount"></div>
      <div class="balance-label">보유 가상화폐</div>
    </div>

    <div style="font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:12px;letter-spacing:1px;">결제 금액 선택</div>
    <div class="amount-grid" id="amountGrid"></div>

    <button class="btn btn-outline btn-full" onclick="goBack()" style="margin-top:4px;">← 처음으로</button>
  </div>
</div>

<!-- 결제 확인 팝업 -->
<div class="confirm-overlay" id="confirmOverlay" style="display:none;">
  <div class="confirm-box">
    <div class="confirm-emoji">💳</div>
    <div class="confirm-title">결제 확인</div>
    <div class="confirm-desc" id="confirmDesc"></div>
    <div class="confirm-amount" id="confirmAmount"></div>
    <div class="confirm-after" id="confirmAfter"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeConfirm()">취소</button>
      <button class="btn btn-gold" style="flex:1;" onclick="doPayment()">결제하기</button>
    </div>
  </div>
</div>

<!-- 결제 완료 팝업 -->
<div class="done-overlay" id="doneOverlay" style="display:none;">
  <div class="done-box">
    <div class="done-emoji">✅</div>
    <div class="done-title">결제 완료!</div>
    <div class="done-name" id="doneName"></div>
    <div class="done-amount" id="doneAmount"></div>
    <div class="done-balance" id="doneBalance"></div>
    <div class="done-countdown" id="doneCountdown"></div>
  </div>
</div>

<!-- 잔고 부족 팝업 -->
<div class="fail-overlay" id="failOverlay" style="display:none;">
  <div class="fail-box">
    <div class="fail-emoji">😢</div>
    <div class="fail-title">잔고가 부족해요!</div>
    <div class="fail-desc" id="failDesc"></div>
    <button class="btn btn-outline btn-full" onclick="closeFail()">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { getNationConfig, getAllStudents, getStudentByName, addTransaction, addShopLog } from "../db.js";
  import { getSession, hashPassword } from "../auth.js";

  // 결제 금액 목록 (나중에 추가 가능)
  const AMOUNTS = [
    { label: "500원", value: 500 },
    { label: "1,000원", value: 1000 },
    { label: "1,500원", value: 1500 },
    { label: "2,000원", value: 2000 },
  ];

  let selectedName = "";
  let currentStudent = null;
  let selectedAmount = 0;

  async function init() {
    const config = await getNationConfig();
    if (config?.name) document.getElementById("nationName").textContent = config.name;

    // 매점 닫힘 체크
    if (!config?.shopOpen) {
      document.querySelector(".shop-wrap").innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <div style="font-size:64px;margin-bottom:16px;">🔒</div>
          <div style="font-family:'Gmarket Sans',sans-serif;font-size:22px;font-weight:700;color:var(--accent2);margin-bottom:8px;">매점이 닫혀있어요</div>
          <div style="font-size:13px;color:var(--text-dim);">매점은 수요일 종례 후 오픈합니다</div>
        </div>`;
      return;
    }

    // 이미 로그인 상태면 바로 STEP2로
    const session = getSession();
    if (session && session.name) {
      const student = await getStudentByName(session.name);
      if (student) {
        currentStudent = student;
        showAmountPanel();
        return;
      }
    }

    loadNames();
  }

  async function loadNames() {
    const [students, config] = await Promise.all([getAllStudents(), getNationConfig()]);
    const allNames = config?.studentNames || [];
    const grid = document.getElementById("nameGrid");

    grid.innerHTML = allNames.map(name => {
      const s = students.find(st => st.id === name);
      const canLogin = s && !s.preCreated; // 비번 설정한 학생만
      return `<div class="name-chip ${canLogin ? "" : "disabled"}" 
        style="${canLogin ? "" : "opacity:0.35;cursor:not-allowed;"}"
        onclick="${canLogin ? `selectName('${name}')` : ""}">
        ${name}
      </div>`;
    }).join("");
  }

  window.selectName = function(name) {
    selectedName = name;
    document.getElementById("selectedNameInput").value = name;
    document.querySelectorAll(".name-chip").forEach(c => c.classList.remove("selected"));
    event.target.classList.add("selected");
  };

  function showAmountPanel() {
    document.getElementById("panel-login").style.display = "none";
    document.getElementById("panel-amount").style.display = "block";
    document.getElementById("step1").className = "step done";
    document.getElementById("step1").textContent = "✓";
    document.getElementById("step2").className = "step active";

    document.getElementById("balanceName").textContent = currentStudent.name;
    document.getElementById("balanceAmount").textContent = (currentStudent.balance || 0).toLocaleString() + "원";

    document.getElementById("amountGrid").innerHTML = AMOUNTS.map(a => {
      const insufficient = (currentStudent.balance || 0) < a.value;
      return `
        <div class="amount-btn ${insufficient ? "disabled" : ""}" onclick="${insufficient ? `showInsufficient(${a.value})` : `selectAmount(${a.value}, this)`}">
          <div class="price">${a.label}</div>
          <div class="price-label">${insufficient ? "잔고 부족 🚫" : "탭하여 선택"}</div>
        </div>`;
    }).join("");
  }

  window.doShopLogin = async function() {
    if (!selectedName) return showToast("이름을 선택해주세요", true);
    const pw = document.getElementById("shopPw").value.trim();
    if (!pw) return showToast("비밀번호를 입력해주세요", true);

    const student = await getStudentByName(selectedName);
    const hashed = await hashPassword(pw);
    if (!student || (student.password !== hashed && student.password !== pw)) {
      return showToast("비밀번호가 틀렸어요", true);
    }

    currentStudent = student;
    showAmountPanel();
  };

  window.selectAmount = function(amount, el) {
    selectedAmount = amount;
    document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("selected"));
    el.classList.add("selected");

    const after = (currentStudent.balance || 0) - amount;
    document.getElementById("confirmDesc").textContent = `${currentStudent.name}님의 결제`;
    document.getElementById("confirmAmount").textContent = amount.toLocaleString() + "원";
    document.getElementById("confirmAfter").textContent = `결제 후 잔고: ${after.toLocaleString()}원`;
    document.getElementById("confirmOverlay").style.display = "flex";
  };

  window.closeConfirm = function() {
    document.getElementById("confirmOverlay").style.display = "none";
    selectedAmount = 0;
    document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("selected"));
  };

  window.doPayment = async function() {
    document.getElementById("confirmOverlay").style.display = "none";

    // 최신 잔고 Firebase에서 재조회
    const freshStudent = await getStudentByName(currentStudent.name);
    const balance = freshStudent?.balance || 0;

    // 잔고 부족 재확인
    if (balance < selectedAmount) {
      document.getElementById("failDesc").innerHTML =
        `현재 잔고: <strong>${balance.toLocaleString()}원</strong><br>결제 금액: <strong>${selectedAmount.toLocaleString()}원</strong><br><br>잔고가 부족해요!`;
      document.getElementById("failOverlay").style.display = "flex";
      return;
    }

    try {
      await addTransaction(
        currentStudent.name,
        -selectedAmount,
        "매점",
        `매점 결제 ${selectedAmount.toLocaleString()}원`,
        "매점키오스크"
      );
      await addShopLog(currentStudent.name, selectedAmount, "매점 구매", "매점키오스크");

      const newBalance = balance - selectedAmount;

      // 완료 팝업
      document.getElementById("doneName").textContent = currentStudent.name + "님";
      document.getElementById("doneAmount").textContent = "-" + selectedAmount.toLocaleString() + "원";
      document.getElementById("doneBalance").textContent = "잔여 잔고: " + newBalance.toLocaleString() + "원";
      document.getElementById("doneOverlay").style.display = "flex";

      // 카운트다운 후 자동 초기화
      let count = 5;
      const countdown = setInterval(() => {
        document.getElementById("doneCountdown").textContent = `${count}초 후 초기화됩니다...`;
        count--;
        if (count < 0) {
          clearInterval(countdown);
          document.getElementById("doneOverlay").style.display = "none";
          resetShop();
        }
      }, 1000);

    } catch(e) {
      showToast("결제 오류: " + e.message, true);
    }
  };

  window.showInsufficient = function(amount) {
    const balance = currentStudent?.balance || 0;
    document.getElementById("failDesc").innerHTML =
      `현재 잔고: <strong>${balance.toLocaleString()}원</strong><br>결제 금액: <strong>${amount.toLocaleString()}원</strong><br><br>잔고가 부족해요!<br>선생님께 가상화폐를 요청하세요.`;
    document.getElementById("failOverlay").style.display = "flex";
  };

  window.closeFail = function() {
    document.getElementById("failOverlay").style.display = "none";
  };

  window.goBack = function() {
    const session = getSession();
    if (session) {
      window.location.href = "me.html";
    } else {
      resetShop();
    }
  };

  window.resetShop = function() {
    selectedName = "";
    currentStudent = null;
    selectedAmount = 0;
    document.getElementById("selectedNameInput").value = "";
    document.getElementById("shopPw").value = "";
    document.querySelectorAll(".name-chip").forEach(c => c.classList.remove("selected"));
    document.getElementById("panel-login").style.display = "block";
    document.getElementById("panel-amount").style.display = "none";
    document.getElementById("step1").className = "step active";
    document.getElementById("step1").textContent = "1";
    document.getElementById("step2").className = "step";
    document.getElementById("step3").className = "step";
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  init();
</script>
</body>
</html>
