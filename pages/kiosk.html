<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="선영국가">
  <meta name="theme-color" content="#1A1A1A">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>현황판 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.dash-wrap { max-width: 700px; margin: 0 auto; padding: 16px; }

/* 통계 카드 그리드 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 8px;
  text-align: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.stat-icon { font-size: 22px; margin-bottom: 6px; filter: saturate(1.1); }
.stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
.stat-value {
  font-size: 18px; font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

/* 섹션 타이틀 */
.section-title {
  font-size: 13px; font-weight: 800;
  color: var(--text);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 보유금 순위 */
.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 6px;
}
.rank-num {
  font-weight: 800;
  font-size: 15px;
  min-width: 30px;
  text-align: center;
  color: var(--text-dim);
}
.rank-num.medal { font-size: 20px; color: inherit; }
.rank-name {
  flex: 1;
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rank-amount {
  font-weight: 800;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
}

/* 신고 카드 */
.report-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 6px;
}
.report-info { flex: 1; min-width: 0; }
.report-title {
  font-size: 13px; font-weight: 700;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.report-meta { font-size: 11px; color: var(--text-dim); }

/* 마지막 업데이트 */
.last-updated {
  font-size: 11px;
  color: var(--text-soft);
  text-align: center;
  margin: 18px 0 4px;
}
.refresh-indicator {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--success);
  border-radius: 50%;
  margin-right: 4px;
  animation: pulse-green 2s infinite;
}
@keyframes pulse-green {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">📊 현황판<span id="dateLabel"></span></div>
  <button class="btn btn-outline btn-sm" id="refreshBtn">🔄</button>
</div>

<div class="dash-wrap has-bottom-nav">
  <!-- 통계 카드 4개 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-label">전체 학생</div>
      <div class="stat-value" id="stat-students">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-label">총 통화량</div>
      <div class="stat-value" id="stat-money">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🚨</div>
      <div class="stat-label">진행 신고</div>
      <div class="stat-value" id="stat-active">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-label">완료 신고</div>
      <div class="stat-value" id="stat-done">-</div>
    </div>
  </div>

  <!-- 보유금 TOP 5 -->
  <div class="section-title">💰 보유금 TOP 5</div>
  <div id="rankList">
    <div class="spinner"></div>
  </div>

  <!-- 진행 중인 신고 -->
  <div class="section-title">🚨 진행 중인 신고</div>
  <div id="reportList">
    <div class="spinner"></div>
  </div>

  <div class="last-updated">
    <span class="refresh-indicator"></span>
    <span id="lastUpdated">자동 갱신: 1분</span>
  </div>
</div>

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a href="me.html"><span class="icon">👤</span>내정보</a>
  <a href="report.html"><span class="icon">🚨</span>신고</a>
  <a href="shop.html"><span class="icon">🛒</span>매점</a>
  <a href="#" onclick="openStock()"><span class="icon">📈</span>주식</a>
  <a href="kiosk.html" class="active"><span class="icon">📊</span>현황판</a>
</nav>

<script type="module">
  import { requireLogin } from "../auth.js";
  import { getAllStudents, getAllReports, getStudentByName } from "../db.js";

  const session = requireLogin();
  if (!session) throw new Error("로그인 필요");

  // 학생이면 주식키 로드 (마스터는 미사용)
  if (session.role !== "마스터") {
    getStudentByName(session.name).then(s => { window._stockKey = s?.stockKey || ""; });
  }

  const escape = str => (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function updateDate() {
    const now = new Date();
    const days = ["일","월","화","수","목","금","토"];
    const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")} (${days[now.getDay()]})`;
    document.getElementById("dateLabel").textContent = dateStr;
  }

  async function loadDashboard() {
    try {
      const [students, reports] = await Promise.all([
        getAllStudents(),
        getAllReports()
      ]);

      // 테스터 제외
      const realStudents = students.filter(s => s.role !== "테스터");

      // 통계 카드
      const totalMoney = realStudents.reduce((s, st) => s + (st.balance || 0), 0);
      const activeReports = reports.filter(r => r.status === "접수됨" || r.status === "조사중");
      const doneReports = reports.filter(r => r.status === "처리완료");

      document.getElementById("stat-students").textContent = realStudents.length + "명";
      document.getElementById("stat-money").textContent = totalMoney.toLocaleString();
      document.getElementById("stat-active").textContent = activeReports.length + "건";
      document.getElementById("stat-done").textContent = doneReports.length + "건";

      // 보유금 TOP 5
      const top5 = [...realStudents]
        .sort((a, b) => (b.balance || 0) - (a.balance || 0))
        .slice(0, 5);

      if (top5.length === 0) {
        document.getElementById("rankList").innerHTML = `<div class="empty-state"><div class="emoji">💰</div>등록된 학생이 없어요</div>`;
      } else {
        document.getElementById("rankList").innerHTML = top5.map((s, idx) => {
          const medals = ["🥇","🥈","🥉"];
          const isMedal = idx < 3;
          return `<div class="rank-item">
            <span class="rank-num ${isMedal ? "medal" : ""}">${isMedal ? medals[idx] : (idx+1)}</span>
            <span class="rank-name">${escape(s.name)}</span>
            <span class="rank-amount">${(s.balance || 0).toLocaleString()}원</span>
          </div>`;
        }).join("");
      }

      // 진행 중인 신고 (최신순)
      const activeSorted = [...activeReports].sort((a, b) =>
        (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)
      );

      if (activeSorted.length === 0) {
        document.getElementById("reportList").innerHTML = `<div class="empty-state"><div class="emoji">✅</div>진행 중인 신고가 없어요</div>`;
      } else {
        document.getElementById("reportList").innerHTML = activeSorted.map(r => {
          const date = r.createdAt?.toDate
            ? r.createdAt.toDate().toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" })
            : "";
          const badgeClass = r.status === "접수됨" ? "badge-gold" : "badge-blue";
          return `<div class="report-item">
            <div class="report-info">
              <div class="report-title">${escape(r.type)}</div>
              <div class="report-meta">${date} · 신고자: 익명</div>
            </div>
            <span class="badge ${badgeClass}">${r.status}</span>
          </div>`;
        }).join("");
      }

      // 갱신 시각
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("lastUpdated").textContent = `마지막 갱신: ${hh}:${mm} · 1분마다 자동 새로고침`;
    } catch (e) {
      console.warn("현황판 로드 실패:", e);
    }
  }

  // 수동 새로고침 버튼
  document.getElementById("refreshBtn").addEventListener("click", () => {
    const btn = document.getElementById("refreshBtn");
    btn.textContent = "⏳";
    loadDashboard().then(() => {
      setTimeout(() => { btn.textContent = "🔄"; }, 400);
    });
  });

  // 초기 로드 + 1분마다 자동 새로고침
  updateDate();
  loadDashboard();
  setInterval(updateDate, 60 * 1000);
  setInterval(loadDashboard, 60 * 1000);

  // 주식 링크 (me.html과 동일)
  window.openStock = function() {
    if (window._stockKey) {
      window.open(`https://sub-teacher.com/API/stock/student.html?key=${window._stockKey}`, "_blank");
    } else {
      alert("선생님께 반짝모의투자 등록을 부탁하세요 📈");
    }
  };
</script>
</body>
</html>
