<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 정보 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.me-wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

.me-profile {
  background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
  border: 1px solid var(--navy-light);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.me-avatar {
  width: 52px; height: 52px;
  background: var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: var(--navy);
  flex-shrink: 0;
}
.me-info h2 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
.me-info .role { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.me-balance { text-align: right; margin-left: auto; }
.me-balance .amount {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 26px; font-weight: 700; color: var(--gold);
}
.me-balance .label { font-size: 11px; color: var(--text-dim); }

/* 공지 */
.notice-item {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-left: 4px solid var(--gold);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
}
.notice-item.checked { border-left-color: var(--accent3); opacity: 0.6; }
.notice-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 8px; margin-bottom: 6px;
}
.notice-title { font-size: 14px; font-weight: 700; }
.notice-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
.notice-date { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

/* 고지서 */
.fine-item {
  background: var(--card);
  border: 1px solid rgba(255,107,107,0.3);
  border-left: 4px solid var(--accent2);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
}
.fine-item.paid { border-left-color: var(--accent3); opacity: 0.6; }
.fine-top {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 6px;
}
.fine-amount {
  font-family: 'Gmarket Sans', sans-serif;
  font-size: 18px; font-weight: 700; color: var(--accent2);
}
.fine-item.paid .fine-amount { color: var(--accent3); }
.fine-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">🏛️ <span id="nationName">선영국가</span><span>내 정보</span></div>
  <button class="btn btn-outline btn-sm" onclick="doLogout()">로그아웃</button>
</div>

<div class="me-wrap has-bottom-nav">
  <!-- 프로필 카드 -->
  <div class="me-profile">
    <div class="me-avatar" id="avatar">?</div>
    <div class="me-info">
      <h2 id="studentName">로딩중...</h2>
      <div class="role" id="studentRole"></div>
    </div>
    <div class="me-balance">
      <div class="amount" id="balance">-</div>
      <div class="label">보유 가상화폐</div>
      <div id="myRank" style="font-size:11px;color:var(--text-dim);margin-top:2px;"></div>
    </div>
    <button id="refreshBtn" style="background:transparent;border:none;cursor:pointer;font-size:20px;padding:4px;" title="새로고침">🔄</button>
  </div>

  <!-- 청약 진행바 -->
  <div id="savingBar" style="display:none;background:var(--card);border:1px solid var(--navy-light);border-radius:12px;padding:12px 16px;margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div style="font-size:12px;font-weight:700;color:var(--text-dim);">🏠 청약 목표</div>
      <div style="font-size:12px;color:var(--gold);font-weight:700;" id="savingText">0 / 5,000원</div>
    </div>
    <div style="background:var(--navy-mid);border-radius:4px;height:8px;overflow:hidden;">
      <div id="savingFill" style="height:100%;background:linear-gradient(to right,var(--gold),var(--accent));border-radius:4px;transition:width 0.5s;width:0%;"></div>
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:4px;" id="savingMsg"></div>
  </div>

  <!-- 탭 -->
  <div class="tab-bar" style="overflow-x:auto;">
    <button class="tab-btn active" data-tab="tx">💸 거래</button>
    <button class="tab-btn" data-tab="notice">📢 공지</button>
    <button class="tab-btn" data-tab="diary">📓 일지</button>
    <button class="tab-btn" data-tab="mission">🎯 미션</button>
    <button class="tab-btn" data-tab="fine">📄 고지서</button>
    <button class="tab-btn" data-tab="board">🗒️ 의견판</button>
  </div>

  <!-- 거래내역 -->
  <div id="panel-tx">
    <div class="spinner" id="tx-spinner"></div>
    <div class="tx-list" id="txList"></div>
    <div class="empty-state" id="tx-empty" style="display:none;">
      <div class="emoji">💸</div>
      아직 거래 내역이 없어요
    </div>
  </div>

  <!-- 공지확인 -->
  <div id="panel-notice" style="display:none;">
    <div class="spinner" id="notice-spinner"></div>
    <div id="noticeList"></div>
    <div class="empty-state" id="notice-empty" style="display:none;">
      <div class="emoji">📢</div>
      등록된 공지가 없어요
    </div>
  </div>

  <!-- 시민일지 -->
  <div id="panel-diary" style="display:none;">
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:14px;font-weight:700;">📓 이번 주 시민일지</div>
        <div id="diaryWeekCount" style="font-size:12px;color:var(--text-dim);"></div>
      </div>
      <textarea id="diaryContent" maxlength="100" placeholder="오늘 느낀 점을 적어보세요 (20자 이상 ~ 100자 이하)" style="background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:8px;padding:10px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;width:100%;height:90px;resize:none;outline:none;"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:4px;">
        <span id="diaryCharCount" style="font-size:11px;color:var(--text-dim);">0 / 100 (최소 20자)</span>
      </div>
      <button class="btn btn-gold btn-full" style="margin-top:8px;" onclick="submitDiary()">📝 일지 작성하기</button>
      <div style="font-size:11px;color:var(--text-dim);margin-top:6px;text-align:center;">주 3회 이상 작성 시 1,000원 지급 (마스터 확인 후)</div>
    </div>
    <div id="diaryList"></div>
    <div class="empty-state" id="diary-empty" style="display:none;"><div class="emoji">📓</div>아직 일지가 없어요</div>
  </div>

  <!-- 미션 -->
  <div id="panel-mission" style="display:none;">
    <div class="spinner" id="mission-spinner"></div>
    <div id="missionList"></div>
    <div class="empty-state" id="mission-empty" style="display:none;"><div class="emoji">🎯</div>등록된 미션이 없어요</div>
  </div>

  <!-- 고지서 -->
  <div id="panel-fine" style="display:none;">
    <div class="spinner" id="fine-spinner"></div>
    <div id="fineList"></div>
    <div class="empty-state" id="fine-empty" style="display:none;">
      <div class="emoji">✅</div>
      미납 고지서가 없어요
    </div>
  </div>

  <!-- 자유게시판 (포스트잇 보드) -->
  <div id="panel-board" style="display:none;">
    <!-- 작성 폼 -->
    <div class="card" style="margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;">✏️ 의견 붙이기</div>
      <textarea id="boardInput" maxlength="100"
        placeholder="자유롭게 의견을 써보세요! (최대 100자)"
        style="background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:8px;padding:10px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;width:100%;height:72px;resize:none;outline:none;box-sizing:border-box;"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span id="boardCharCount" style="font-size:11px;color:var(--text-dim);">0 / 100</span>
        <button class="btn btn-gold" onclick="submitBoard()" style="padding:8px 20px;font-size:13px;">🗒️ 붙이기</button>
      </div>
    </div>
    <!-- 보드 -->
    <div class="spinner" id="board-spinner"></div>
    <div id="boardGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"></div>
    <div class="empty-state" id="board-empty" style="display:none;">
      <div class="emoji">🗒️</div>
      아직 붙여진 의견이 없어요
    </div>
  </div>
</div>

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a href="me.html" class="active"><span class="icon">👤</span>내정보</a>
  <a href="report.html"><span class="icon">🚨</span>신고</a>
  <a href="shop.html"><span class="icon">🛒</span>매점</a>
  <a href="#" onclick="openStock()"><span class="icon">📈</span>주식</a>
  <a href="kiosk.html"><span class="icon">📊</span>현황판</a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
  import { requireLogin, clearSession } from "../auth.js";
  import { getStudentByName, getTransactions, getNotices, confirmNotice, getFines, getNationConfig, getAllStudents, addDiary, getMyDiaries, getWeekDiaryCount, getMissions, applyMission, addBoardPost, getBoardPosts } from "../db.js";

  const session = requireLogin();
  if (!session) throw new Error("로그인 필요");

  const { name } = session;
  let currentTab = "tx";

  async function refreshAll() {
    const btn = document.querySelector('[onclick="refreshAll()"]');
    if (btn) btn.style.animation = "spin 0.5s linear";
    await init();
    if (btn) btn.style.animation = "";
    showToast("✅ 새로고침 완료!");
  }

  async function init() {
    // 국가 이름
    const config = await getNationConfig();
    if (config?.name) document.getElementById("nationName").textContent = config.name;

    // 학생 정보
    const student = await getStudentByName(name);
    if (!student) { clearSession(); window.location.href = "login.html"; return; }

    document.getElementById("avatar").textContent = name[0];
    document.getElementById("studentName").textContent = name;
    document.getElementById("studentRole").innerHTML = `<span class="badge badge-blue">${student.role}</span>`;
    document.getElementById("balance").textContent = (student.balance || 0).toLocaleString() + "원";
    window._stockKey = student.stockKey || "";
    updateSavingBar(student.balance || 0);

    // 내 랭킹 계산
    const { getAllStudents } = await import("../db.js");
    const allSt = await getAllStudents();
    const realSt = allSt.filter(s => s.role !== "테스터").sort((a,b) => (b.balance||0) - (a.balance||0));
    const myRank = realSt.findIndex(s => s.name === name) + 1;
    if (myRank > 0) {
      const medal = myRank === 1 ? "🥇" : myRank === 2 ? "🥈" : myRank === 3 ? "🥉" : "";
      document.getElementById("myRank").textContent = `${medal} 자산 ${myRank}위 / ${realSt.length}명`;
    }

    loadTx();
  }

  async function loadTx() {
    document.getElementById("tx-spinner").style.display = "block";
    const txs = await getTransactions(name);
    document.getElementById("tx-spinner").style.display = "none";

    if (txs.length === 0) {
      document.getElementById("tx-empty").style.display = "block";
      return;
    }

    const typeIcon = { "주급":"💰", "세금":"🏛️", "칭찬쿠폰":"🌟", "매점":"🛒", "벌금":"⚠️", "이벤트":"🎉", "기타":"📝" };

    document.getElementById("txList").innerHTML = txs.map(tx => {
      const isPlus = tx.amount > 0;
      const date = tx.createdAt?.toDate ? tx.createdAt.toDate().toLocaleDateString("ko-KR", { month:"numeric", day:"numeric", weekday:"short" }) : "";
      return `
        <div class="tx-item">
          <div class="tx-icon">${typeIcon[tx.type] || "📝"}</div>
          <div class="tx-desc">
            <div class="title">${tx.memo || tx.type}</div>
            <div class="date">${date}</div>
          </div>
          <div class="tx-amount ${isPlus ? "plus" : "minus"}">
            ${isPlus ? "+" : ""}${tx.amount.toLocaleString()}원
          </div>
        </div>`;
    }).join("");
  }

  async function loadNotices() {
    document.getElementById("notice-spinner").style.display = "block";
    const notices = await getNotices();
    document.getElementById("notice-spinner").style.display = "none";

    if (notices.length === 0) {
      document.getElementById("notice-empty").style.display = "block";
      return;
    }

    document.getElementById("noticeList").innerHTML = notices.map(n => {
      const confirmed = (n.confirmedBy || []).includes(name);
      const date = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleDateString("ko-KR", { month:"numeric", day:"numeric" }) : "";
      return `
        <div class="notice-item ${confirmed ? "checked" : ""}">
          <div class="notice-top">
            <div class="notice-title">${n.title}</div>
            ${confirmed
              ? `<span class="badge badge-green">✓ 확인완료</span>`
              : `<button class="btn btn-gold btn-sm" onclick="doConfirm('${n.id}', this)">확인</button>`}
          </div>
          <div class="notice-desc">${n.content}</div>
          <div class="notice-date">${date} · ${n.by || ""}</div>
        </div>`;
    }).join("");
  }

  async function loadFines() {
    document.getElementById("fine-spinner").style.display = "block";
    const fines = await getFines(name);
    document.getElementById("fine-spinner").style.display = "none";

    if (fines.length === 0) {
      document.getElementById("fine-empty").style.display = "block";
      return;
    }

    document.getElementById("fineList").innerHTML = fines.map(f => {
      const date = f.createdAt?.toDate ? f.createdAt.toDate().toLocaleDateString("ko-KR", { month:"numeric", day:"numeric" }) : "";
      return `
        <div class="fine-item ${f.paid ? "paid" : ""}">
          <div class="fine-top">
            <div>
              <div style="font-size:13px;font-weight:700;margin-bottom:2px;">
                ${f.paid ? "✅ 납부완료" : "⚠️ 미납 고지서"}
              </div>
              <div style="font-size:11px;color:var(--text-dim);">${date} · 발행: ${f.by || ""}</div>
            </div>
            <div class="fine-amount">${f.amount.toLocaleString()}원</div>
          </div>
          <div class="fine-desc">사유: ${f.reason}</div>
          ${!f.paid ? `<div style="font-size:11px;color:var(--accent2);margin-top:8px;">세금징수원에게 직접 납부 후 처리됩니다</div>` : ""}
        </div>`;
    }).join("");
  }

  // 탭 이벤트 리스너
  document.querySelectorAll(".tab-btn[data-tab]").forEach(btn => {
    btn.addEventListener("click", function() {
      const tab = this.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      ["tx","notice","fine","diary","mission","board"].forEach(t => {
        const el = document.getElementById("panel-" + t);
        if (el) el.style.display = "none";
      });
      document.getElementById("panel-" + tab).style.display = "block";
      currentTab = tab;
      if (tab === "notice") loadNotices();
      if (tab === "fine") loadFines();
      if (tab === "diary") loadDiary();
      if (tab === "mission") loadMissions();
      if (tab === "board") loadBoard();
    });
  });

  // 새로고침 버튼
  document.getElementById("refreshBtn").addEventListener("click", refreshAll);

  window.doConfirm = async function(noticeId, btn) {
    btn.disabled = true;
    btn.textContent = "처리중...";
    try {
      await confirmNotice(noticeId, name);
      showToast("✅ 공지 확인 완료!");
      loadNotices();
    } catch(e) {
      showToast("오류가 발생했어요", true);
      btn.disabled = false;
      btn.textContent = "확인";
    }
  };

  // 청약 진행바
  function updateSavingBar(balance) {
    const goal = 5000;
    const pct = Math.min(Math.round(balance / goal * 100), 100);
    document.getElementById("savingBar").style.display = "block";
    document.getElementById("savingFill").style.width = pct + "%";
    document.getElementById("savingText").textContent = `${balance.toLocaleString()} / ${goal.toLocaleString()}원`;
    if (balance >= goal) {
      document.getElementById("savingMsg").textContent = "✅ 청약 신청 가능해요!";
      document.getElementById("savingMsg").style.color = "var(--accent3)";
    } else {
      document.getElementById("savingMsg").textContent = `${(goal - balance).toLocaleString()}원 더 모으면 청약 신청 가능!`;
    }
  }

  // 시민일지
  async function loadDiary() {
    document.getElementById("diary-empty").style.display = "none";
    const [diaries, weekCount] = await Promise.all([getMyDiaries(name), getWeekDiaryCount(name)]);
    const rewardReached = weekCount >= 3;
    document.getElementById("diaryWeekCount").innerHTML =
      `이번 주 ${weekCount}회 작성 <span style="color:${rewardReached ? "var(--accent3)" : "var(--gold)"};">${rewardReached ? "✅ 보상 조건 달성!" : "(3회 이상 시 보상)"}</span>`;
    if (diaries.length === 0) {
      document.getElementById("diary-empty").style.display = "block";
      return;
    }
    document.getElementById("diaryList").innerHTML = diaries.map(d => {
      const date = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString("ko-KR",{month:"numeric",day:"numeric",weekday:"short"}) : "";
      return `<div class="tx-item"><div class="tx-icon">📓</div><div class="tx-desc"><div class="title">${d.content}</div><div class="date">${date}</div></div></div>`;
    }).join("");
  }

  // 일지 글자수 카운터 (20자 미만이면 빨간색, 20자 이상이면 초록색)
  document.getElementById("diaryContent").addEventListener("input", function() {
    const len = this.value.length;
    const counter = document.getElementById("diaryCharCount");
    counter.textContent = `${len} / 100 (최소 20자)`;
    counter.style.color = len < 20 ? "var(--accent2)" : "var(--accent3)";
  });

  window.submitDiary = async function() {
    const content = document.getElementById("diaryContent").value.trim();
    if (!content) return showToast("내용을 입력해주세요", true);
    if (content.length < 20) return showToast("20자 이상 작성해주세요", true);
    if (content.length > 100) return showToast("100자 이내로 작성해주세요", true);
    const btn = event.target;
    btn.disabled = true;
    try {
      await addDiary(name, content);
      showToast("📓 일지 작성 완료! 주 3회 달성 시 1,000원 지급돼요 😊");
      document.getElementById("diaryContent").value = "";
      const counter = document.getElementById("diaryCharCount");
      counter.textContent = "0 / 100 (최소 20자)";
      counter.style.color = "var(--text-dim)";
      loadDiary();
    } catch(e) {
      showToast("오류: " + e.message, true);
    } finally { btn.disabled = false; }
  };

  // 미션
  async function loadMissions() {
    document.getElementById("mission-spinner").style.display = "block";
    const missions = await getMissions();
    document.getElementById("mission-spinner").style.display = "none";
    if (missions.length === 0) {
      document.getElementById("mission-empty").style.display = "block";
      return;
    }
    const escape = str => (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    document.getElementById("missionList").innerHTML = missions.map(m => `
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
          <div style="font-size:15px;font-weight:700;">🎯 ${escape(m.title)}</div>
          <div style="font-family:'Gmarket Sans',sans-serif;font-size:16px;color:var(--gold);font-weight:700;">+${(m.reward||0).toLocaleString()}원</div>
        </div>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;line-height:1.5;">${escape(m.desc)}</div>
        ${m.condition ? `<div style="font-size:12px;color:var(--accent3);background:rgba(105,240,174,0.08);border-left:3px solid var(--accent3);padding:8px 12px;border-radius:4px;margin-bottom:10px;line-height:1.5;"><span style="font-weight:700;">✅ 완료 조건</span><br>${escape(m.condition)}</div>` : ""}
        <button class="btn btn-gold btn-sm mission-apply-btn" data-id="${m.id}" data-title="${escape(m.title)}" data-reward="${m.reward||0}">완료 신청하기</button>
      </div>`).join("");

    // 미션 신청 버튼 이벤트
    document.querySelectorAll(".mission-apply-btn").forEach(btn => {
      btn.addEventListener("click", async function() {
        this.disabled = true;
        try {
          const reward = parseInt(this.dataset.reward) || 0;
          await applyMission(this.dataset.id, name, this.dataset.title, reward);
          showToast(`🎯 "${this.dataset.title}" 신청 완료! 승인 후 ${reward.toLocaleString()}원 지급돼요`);
          this.textContent = "신청됨 ✅";
        } catch(e) {
          showToast("오류: " + e.message, true);
          this.disabled = false;
        }
      });
    });
  }



  window.doLogout = function() {
    clearSession();
    window.location.href = "login.html";
  };

  window.openStock = function() {
    if (window._stockKey) {
      window.open(`https://sub-teacher.com/API/stock/student.html?key=${window._stockKey}`, "_blank");
    } else {
      showToast("선생님께 반짝모의투자 등록을 부탁하세요 📈", true);
    }
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  init();

  // ── 자유게시판 ──────────────────────────
  const BOARD_COLORS = ["#fff9c4","#b2f5ea","#fce4ec","#e8d5ff","#ffe0b2"];

  document.getElementById("boardInput").addEventListener("input", function() {
    document.getElementById("boardCharCount").textContent = this.value.length + " / 100";
  });

  async function loadBoard() {
    document.getElementById("board-spinner").style.display = "block";
    document.getElementById("board-empty").style.display = "none";
    document.getElementById("boardGrid").innerHTML = "";
    const posts = await getBoardPosts();
    document.getElementById("board-spinner").style.display = "none";
    if (!posts.length) {
      document.getElementById("board-empty").style.display = "flex";
      return;
    }
    document.getElementById("boardGrid").innerHTML = posts.map(p => {
      const date = p.createdAt?.seconds
        ? new Date(p.createdAt.seconds * 1000).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
        : "";
      return `<div style="background:${p.color};border-radius:4px 4px 4px 4px;padding:14px 12px 10px;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:2px 4px 10px rgba(0,0,0,0.25);position:relative;font-family:'Noto Sans KR',sans-serif;">
        <div style="font-size:13px;color:#222;line-height:1.55;word-break:break-all;white-space:pre-wrap;">${escapeHtml(p.content)}</div>
        <div style="font-size:10px;color:#888;margin-top:8px;text-align:right;">${date}</div>
      </div>`;
    }).join("");
  }

  window.submitBoard = async function() {
    const input = document.getElementById("boardInput");
    const content = input.value.trim();
    if (!content) return showToast("내용을 입력해주세요", true);
    const color = BOARD_COLORS[Math.floor(Math.random() * BOARD_COLORS.length)];
    try {
      await addBoardPost(content, color);
      input.value = "";
      document.getElementById("boardCharCount").textContent = "0 / 100";
      showToast("🗒️ 의견이 붙여졌어요!");
      loadBoard();
    } catch(e) {
      showToast("오류가 발생했어요", true);
    }
  };

  function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
